<div class="container mx-auto p-4">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-gray-800">Gestion des Utilisateurs</h1>
    <button 
      (click)="toggleForm()" 
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
      {{ showForm ? 'Annuler' : '+ Ajouter Utilisateur' }}
    </button>
  </div>

  <!-- Messages -->
  <div *ngIf="successMessage" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
    {{ successMessage }}
  </div>
  <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    {{ error }}
  </div>

  <!-- Formulaire -->
  <div *ngIf="showForm" class="bg-white rounded-lg shadow-md p-6 mb-6">
    <form [formGroup]="userForm" (ngSubmit)="submitForm()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
          <input 
            type="email" 
            formControlName="email"
            class="w-full px-3 py-2 border border-gray-300 rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nom *</label>
          <input 
            type="text" 
            formControlName="nom"
            class="w-full px-3 py-2 border border-gray-300 rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Prénom *</label>
          <input 
            type="text" 
            formControlName="prenom"
            class="w-full px-3 py-2 border border-gray-300 rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Rôle *</label>
          <select 
            formControlName="role"
            class="w-full px-3 py-2 border border-gray-300 rounded-md">
            <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Site</label>
          <select 
            formControlName="site_id"
            class="w-full px-3 py-2 border border-gray-300 rounded-md">
            <option value="">Pas de site assigné</option>
            <option *ngFor="let site of sites" [value]="site.id">{{ site.nom }}</option>
          </select>
        </div>
      </div>
      <div class="flex gap-2">
        <button 
          type="submit" 
          [disabled]="loading"
          class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded disabled:opacity-50">
          {{ loading ? 'Création...' : 'Créer' }}
        </button>
        <button 
          type="button" 
          (click)="toggleForm()"
          class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded">
          Annuler
        </button>
      </div>
    </form>
  </div>

  <!-- Tableau -->
  <div class="bg-white rounded-lg shadow-md overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-gray-100 border-b">
          <tr>
            <th class="px-4 py-2 text-left text-sm font-semibold">Email</th>
            <th class="px-4 py-2 text-left text-sm font-semibold">Nom</th>
            <th class="px-4 py-2 text-left text-sm font-semibold">Site</th>
            <th class="px-4 py-2 text-left text-sm font-semibold">Rôle</th>
            <th class="px-4 py-2 text-center text-sm font-semibold">Actif</th>
            <th class="px-4 py-2 text-center text-sm font-semibold">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users" class="border-b hover:bg-gray-50">
            <td class="px-4 py-2 text-sm">{{ user.email }}</td>
            <td class="px-4 py-2 text-sm">{{ user.prenom }} {{ user.nom }}</td>
            <td class="px-4 py-2 text-sm">{{ getSiteName(user.site_id) }}</td>
            <td class="px-4 py-2 text-sm">
              <select 
                [value]="user.role"
                (change)="updateUserRole(user.id, $any($event.target).value)"
                class="px-2 py-1 text-xs rounded">
                <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
              </select>
            </td>
            <td class="px-4 py-2 text-center text-sm">
              <span [class]="user.actif ? 'text-green-600' : 'text-red-600'">
                {{ user.actif ? '✓' : '✗' }}
              </span>
            </td>
            <td class="px-4 py-2 text-center text-sm">
              <button class="text-blue-600 hover:text-blue-800 mr-2">Éditer</button>
              <button class="text-red-600 hover:text-red-800">Supprimer</button>
            </td>
          </tr>
          <tr *ngIf="users.length === 0">
            <td colspan="6" class="px-4 py-4 text-center text-gray-500">
              Aucun utilisateur trouvé
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
