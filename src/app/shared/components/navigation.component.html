<button
  class="mobile-menu-toggle"
  type="button"
  (click)="toggleMenu()"
  [attr.aria-expanded]="menuOpen"
  [attr.aria-label]="menuOpen ? 'Fermer le menu' : 'Ouvrir le menu'"
>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M4 7H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    <path d="M4 12H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    <path d="M4 17H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
  </svg>
</button>
<div class="mobile-backdrop" *ngIf="menuOpen" (click)="closeMenu()"></div>
<aside class="sidebar" [class.open]="menuOpen">
  <div class="sidebar-header">
    <div class="sidebar-brand">GESTION</div>
    <div class="sidebar-tag">MANUTANTION</div>
  </div>

  <div class="sidebar-divider"></div>

  <nav class="nav-section">
    <ul class="nav-list">
      <ng-container *ngFor="let item of navItems">
        <li class="nav-item" *ngIf="!item.adminOnly || isAdmin">
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
            (click)="closeMenu()"
            >
            {{ item.label }}
          </a>
        </li>
      </ng-container>
    </ul>
  </nav>

  <div class="logout-wrapper" *ngIf="currentUser">
    <button class="logout-button" type="button" (click)="logout()" title="Vous êtes sur le point de vous déconnecter">
      <span class="logout-button__user">
        <span class="logout-button__avatar">{{ avatarLabel }}</span>
        <span class="logout-button__meta">
          <span class="logout-button__email">{{ currentUser.email }}</span>
          <span class="logout-button__action">Déconnexion</span>
        </span>
      </span>
      <span class="logout-button__arrow">›</span>
    </button>
  </div>
</aside>
