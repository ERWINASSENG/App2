<nav class="navbar">
  <div class="navbar-container">
    <!-- Logo -->
    <div class="navbar-brand">
      <a routerLink="/" class="logo">
        <span class="logo-text">GESTION</span>
      </a>
    </div>

    <!-- Desktop Navigation Menu -->
    <ul class="nav-menu">
      <ng-container *ngFor="let item of navItems">
        <li class="nav-item" *ngIf="!item.adminOnly || isAdmin">
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
          >
            {{ item.label }}
          </a>
        </li>
      </ng-container>
    </ul>

    <!-- User Section -->
    <div class="user-section" *ngIf="currentUser">
      <div class="logout-wrapper">
        <button class="logout-button" type="button" (click)="logout()" title="Vous êtes sur le point de vous déconnecter">
          <span class="logout-button__user">
            <span class="logout-button__avatar">{{ avatarLabel }}</span>
            <span class="logout-button__meta">
              <span class="logout-button__email">{{ currentUser.email }}</span>
              <span class="logout-button__action">Déconnexion</span>
            </span>
          </span>
          <span class="logout-button__arrow">›</span>
        </button>
      </div>
    </div>

    <!-- Mobile Menu Toggle -->
    <button
      class="hamburger"
      type="button"
      (click)="toggleMenu()"
      [class.active]="menuOpen"
      [attr.aria-expanded]="menuOpen"
      [attr.aria-label]="menuOpen ? 'Fermer le menu' : 'Ouvrir le menu'"
      aria-controls="mobile-menu"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </div>

  <!-- Mobile Navigation Overlay -->
  <div class="navbar-overlay" [class.active]="menuOpen" *ngIf="menuOpen" (click)="closeMenu()"></div>

  <!-- Mobile Navigation Menu -->
  <ul id="mobile-menu" class="nav-menu mobile" [class.active]="menuOpen">
    <ng-container *ngFor="let item of navItems">
      <li class="nav-item" *ngIf="!item.adminOnly || isAdmin">
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
          (click)="closeMenu()"
        >
          {{ item.label }}
        </a>
      </li>
    </ng-container>

    <li class="nav-divider" *ngIf="currentUser"></li>

    <li class="nav-item user-profile" *ngIf="currentUser">
      <div class="logout-wrapper">
        <button class="logout-button" type="button" (click)="logout()" title="Vous êtes sur le point de vous déconnecter">
          <span class="logout-button__user">
            <span class="logout-button__avatar">{{ avatarLabel }}</span>
            <span class="logout-button__meta">
              <span class="logout-button__email">{{ currentUser.email }}</span>
              <span class="logout-button__action">Déconnexion</span>
            </span>
          </span>
          <span class="logout-button__arrow">›</span>
        </button>
      </div>
    </li>
  </ul>
</nav>
